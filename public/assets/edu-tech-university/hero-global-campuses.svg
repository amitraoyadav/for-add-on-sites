<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="globalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041F38" />
      <stop offset="60%" stop-color="#072B4D" />
      <stop offset="100%" stop-color="#0E4E7A" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#globalGrad)" />
  
  <!-- World map stylised coordinates & dots -->
  <g opacity="0.3" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3 3">
    <ellipse cx="300" cy="190" rx="260" ry="120" />
    <line x1="40" y1="190" x2="560" y2="190" />
    <line x1="300" y1="70" x2="300" y2="310" />
  </g>
  
  <!-- Campus Markers -->
  <!-- Melbourne -->
  <circle cx="460" cy="260" r="7" fill="#38BDF8" />
  <circle cx="460" cy="260" r="14" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="475" y="264" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Melbourne (Clayton / Caulfield)</text>
  
  <!-- Malaysia -->
  <circle cx="400" cy="180" r="6" fill="#F59E0B" />
  <text x="415" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Malaysia (Sunway City)</text>
  
  <!-- Indonesia -->
  <circle cx="410" cy="210" r="5" fill="#10B981" />
  <text x="425" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">Indonesia (Jakarta)</text>
  
  <!-- Prato Italy -->
  <circle cx="270" cy="130" r="5" fill="#EC4899" />
  <text x="285" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#FBCFE8">Prato Centre (Italy)</text>
  
  <!-- India -->
  <circle cx="350" cy="165" r="5" fill="#F97316" />
  <text x="365" y="169" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#FED7AA">IITB-ETU Academy (Mumbai)</text>

  <!-- Tag -->
  <g transform="translate(48, 48)">
    <rect width="180" height="28" rx="6" fill="#006DAE" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1" />
    <text x="90" y="18" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5" fill="#38BDF8" text-anchor="middle">
      INTERNATIONAL FOOTPRINT
    </text>
  </g>

  <text x="48" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">
    A TRULY GLOBAL
  </text>
  <text x="48" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#38BDF8">
    UNIVERSITY EXPERIENCE
  </text>
  <text x="48" y="190" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    Study seamlessly across 4 continents. Explore global exchange & double degrees.
  </text>
</svg>
