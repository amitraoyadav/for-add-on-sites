      <stop offset="0%" stop-color="#022C22" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#researchGrad)" />
  
  <circle cx="500" cy="180" r="130" fill="#10B981" fill-opacity="0.15" />
  
  <!-- Molecule / Network graphics -->
  <g stroke="#34D399" stroke-width="1.5">
    <line x1="420" y1="120" x2="480" y2="160" />
    <line x1="480" y1="160" x2="540" y2="130" />
    <line x1="480" y1="160" x2="480" y2="240" />
    <line x1="480" y1="240" x2="430" y2="280" />
    <line x1="480" y1="240" x2="530" y2="270" />
    <circle cx="420" cy="120" r="7" fill="#10B981" />
    <circle cx="480" cy="160" r="9" fill="#F59E0B" />
    <circle cx="540" cy="130" r="6" fill="#38BDF8" />
