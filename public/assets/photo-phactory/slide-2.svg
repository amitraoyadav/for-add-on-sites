<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" fill="none">
  <defs>
    <linearGradient id="slider2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="twilightSun" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FB923C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="800" fill="url(#slider2Grad)" />
  <circle cx="960" cy="360" r="450" fill="url(#twilightSun)" />

  <!-- Beach / Horizon Waves Reflection -->
  <path d="M0 600 Q 480 580 960 600 T 1920 600 L 1920 800 L 0 800 Z" fill="#0A0F1D" />
  <path d="M0 650 Q 500 640 1000 660 T 1920 650 L 1920 800 L 0 800 Z" fill="#050811" />

  <!-- Pre-wedding Couple walking by water reflection -->
  <g fill="#020408">
    <ellipse cx="940" cy="710" rx="35" ry="8" opacity="0.4" />
    <circle cx="920" cy="460" r="16" />
    <path d="M905 480 C900 520 895 560 890 680 L920 680 L925 580 L930 680 L945 680 C945 560 935 520 930 480 Z" />
    
    <circle cx="975" cy="470" r="14" />
    <path d="M960 490 C965 530 960 580 950 690 L1020 690 C1005 600 990 530 985 490 Z" />
    
    <!-- Holding hands -->
    <path d="M930 520 Q 950 535 965 525" stroke="#020408" stroke-width="6" fill="none" />
  </g>

  <!-- Twilight Star Sparkles -->
  <g fill="#FEF08A" opacity="0.7">
    <circle cx="450" cy="180" r="2.5" />
    <circle cx="620" cy="120" r="3" />
    <circle cx="1320" cy="140" r="2.5" />
    <circle cx="1500" cy="220" r="3" />
    <circle cx="960" cy="180" r="4" />
  </g>
</svg>
