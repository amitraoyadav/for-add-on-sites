<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <!-- Camera Shutter / Express Bolt Icon -->
  <g transform="translate(10, 8)">
    <rect x="0" y="4" width="60" height="56" rx="14" fill="#0F172A" stroke="#E11D48" stroke-width="2.5"/>
    <circle cx="30" cy="32" r="18" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <circle cx="30" cy="32" r="9" fill="#E11D48"/>
    <circle cx="26" cy="28" r="3" fill="#FFFFFF" opacity="0.8"/>
    <!-- Small flash dot -->
    <circle cx="48" cy="16" r="3" fill="#F43F5E"/>
    <!-- Fast shutter notch -->
    <path d="M22 14L38 14" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="84" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="26" letter-spacing="1.5" fill="#0F172A">
    SHOOT<tspan fill="#E11D48">EXPRESS</tspan>
  </text>
  <text x="86" y="56" font-family="'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="4" fill="#64748B">
    PHOTOGRAPHY MUMBAI
  </text>
</svg>
