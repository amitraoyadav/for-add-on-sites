<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRevels" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgRevels)" rx="16" />

  <!-- Concert & Festival Stage Lights -->
  <g transform="translate(50, 60)">
    <!-- Stage Spotlights Beams -->
    <polygon points="120,0 40,240 180,240" fill="#FDE047" opacity="0.25" />
    <polygon points="250,0 150,240 350,240" fill="#F43F5E" opacity="0.3" />
    <polygon points="380,0 320,240 460,240" fill="#38BDF8" opacity="0.25" />

    <!-- Stage Platform -->
    <rect x="50" y="220" width="400" height="30" fill="#0F172A" rx="4" />
    <rect x="180" y="190" width="140" height="30" fill="#1E293B" rx="4" />

    <!-- Crowd Silhouette -->
    <path d="M20 280 Q50 250 80 280 T140 280 T200 280 T260 280 T320 280 T380 280 T440 280 T500 280 L500 320 L20 320 Z" fill="#020617" />
    <!-- Cheering Hands -->
    <g fill="#020617">
      <rect x="90" y="245" width="8" height="20" rx="3" />
      <rect x="180" y="235" width="9" height="25" rx="3" />
      <rect x="290" y="238" width="9" height="25" rx="3" />
      <rect x="390" y="242" width="8" height="22" rx="3" />
    </g>
  </g>

  <!-- Banner -->
  <g transform="translate(40, 40)">
    <rect width="250" height="42" rx="8" fill="#9F1239" stroke="#FB7185" stroke-width="1.5" />
    <text x="20" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#FFE4E6">REVELS &amp; TECHTATVA</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FECDD3">Premier Cultural &amp; Tech Conclaves</text>
  </g>
</svg>
