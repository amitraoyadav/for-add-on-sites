<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPlacement" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgPlacement)" rx="16" />
  
  <!-- Data Bars / Career Growth Curve -->
  <g transform="translate(50, 100)">
    <!-- Grid lines -->
    <line x1="40" y1="20" x2="480" y2="20" stroke="#334155" stroke-dasharray="4" />
    <line x1="40" y1="80" x2="480" y2="80" stroke="#334155" stroke-dasharray="4" />
    <line x1="40" y1="140" x2="480" y2="140" stroke="#334155" stroke-dasharray="4" />
    <line x1="40" y1="200" x2="480" y2="200" stroke="#334155" stroke-dasharray="4" />

    <!-- Histogram Bars -->
    <rect x="70" y="140" width="45" height="80" rx="6" fill="#3B82F6" opacity="0.7" />
    <rect x="145" y="110" width="45" height="110" rx="6" fill="#6366F1" opacity="0.8" />
    <rect x="220" y="80" width="45" height="140" rx="6" fill="#8B5CF6" opacity="0.85" />
    <rect x="295" y="50" width="45" height="170" rx="6" fill="#EC4899" opacity="0.9" />
    <rect x="370" y="20" width="55" height="200" rx="6" fill="url(#goldGrad)" filter="drop-shadow(0 8px 12px rgba(245,158,11,0.4))" />

    <!-- Trajectory Spline -->
    <path d="M92 140 Q167 100 242 75 T397 20" fill="none" stroke="#FBBF24" stroke-width="4" />
    <circle cx="397" cy="20" r="8" fill="#FFFFFF" stroke="#D97706" stroke-width="3" />
    
    <!-- Top Notch Recruiter Logos Indicator -->
    <rect x="40" y="240" width="440" height="36" rx="8" fill="#1E293B" stroke="#475569" />
    <text x="260" y="263" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">Microsoft · Google · Cisco · Amazon · Goldman Sachs · Deloitte</text>
  </g>

  <!-- Highlight CTC Badge -->
  <g transform="translate(40, 40)">
    <rect width="250" height="46" rx="23" fill="rgba(234,88,12,0.95)" stroke="#FED7AA" stroke-width="1.5" />
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF">₹54.75 LPA</text>
    <text x="135" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FEF08A">HIGHEST CTC</text>
    <text x="135" y="36" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF">350+ Global Recruiters</text>
  </g>
</svg>
