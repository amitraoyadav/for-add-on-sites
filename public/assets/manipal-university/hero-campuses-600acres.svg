<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgSky)" rx="16" />
  
  <!-- Modern Campus Landmark Architecture -->
  <g transform="translate(60, 90)">
    <!-- Main Iconic Manipal Tower -->
    <rect x="180" y="30" width="120" height="230" rx="4" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <!-- Clock Tower Crown -->
    <polygon points="180,30 240,0 300,30" fill="url(#terracotta)" />
    <!-- Architectural Clock -->
    <circle cx="240" cy="45" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
    <line x1="240" y1="45" x2="240" y2="37" stroke="#78350F" stroke-width="2" />
    <line x1="240" y1="45" x2="247" y2="45" stroke="#78350F" stroke-width="2" />
    
    <!-- Glass Windows grid -->
    <g fill="#38BDF8" opacity="0.8">
      <rect x="195" y="70" width="20" height="25" rx="2" />
      <rect x="225" y="70" width="30" height="25" rx="2" />
      <rect x="265" y="70" width="20" height="25" rx="2" />
      <rect x="195" y="105" width="20" height="25" rx="2" />
      <rect x="225" y="105" width="30" height="25" rx="2" />
      <rect x="265" y="105" width="20" height="25" rx="2" />
      <rect x="195" y="140" width="20" height="25" rx="2" />
      <rect x="225" y="140" width="30" height="25" rx="2" />
      <rect x="265" y="140" width="20" height="25" rx="2" />
      <rect x="195" y="175" width="20" height="25" rx="2" />
      <rect x="225" y="175" width="30" height="25" rx="2" />
      <rect x="265" y="175" width="20" height="25" rx="2" />
    </g>

    <!-- Flanking Academic Wings -->
    <rect x="50" y="100" width="130" height="160" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <rect x="300" y="100" width="130" height="160" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <g fill="#FDBA74" opacity="0.6">
      <rect x="65" y="120" width="25" height="18" rx="2" />
      <rect x="100" y="120" width="25" height="18" rx="2" />
      <rect x="135" y="120" width="25" height="18" rx="2" />
      <rect x="315" y="120" width="25" height="18" rx="2" />
      <rect x="350" y="120" width="25" height="18" rx="2" />
      <rect x="385" y="120" width="25" height="18" rx="2" />
      <rect x="65" y="150" width="25" height="18" rx="2" />
      <rect x="100" y="150" width="25" height="18" rx="2" />
      <rect x="135" y="150" width="25" height="18" rx="2" />
      <rect x="315" y="150" width="25" height="18" rx="2" />
      <rect x="350" y="150" width="25" height="18" rx="2" />
      <rect x="385" y="150" width="25" height="18" rx="2" />
    </g>
    
    <!-- Green Hill Terraces -->
    <path d="M0 260 Q120 230 240 250 T480 260 L480 280 L0 280 Z" fill="#15803D" opacity="0.9" />
    <path d="M-20 270 Q100 245 250 265 T500 270 L500 300 L-20 300 Z" fill="#166534" />
  </g>

  <!-- Overlay Stats Pill -->
  <g transform="translate(40, 40)">
    <rect width="210" height="42" rx="21" fill="rgba(15,23,42,0.85)" stroke="#F97316" stroke-width="1.5" />
    <circle cx="24" cy="21" r="12" fill="#EA580C" />
    <text x="24" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="46" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">600+ ACRES CAMPUS</text>
    <text x="46" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FDBA74">6 Global Campuses Network</text>
  </g>
</svg>
