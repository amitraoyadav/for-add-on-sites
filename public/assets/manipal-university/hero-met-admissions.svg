<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgMet)" rx="16" />

  <!-- Admission Portal Silhouette / Student Interface -->
  <g transform="translate(80, 80)">
    <!-- Computer Monitor Mockup -->
    <rect x="40" y="20" width="360" height="220" rx="10" fill="#0F172A" stroke="#EA580C" stroke-width="3" />
    <rect x="55" y="35" width="330" height="185" rx="6" fill="#1E293B" />
    
    <!-- Screen Header -->
    <rect x="55" y="35" width="330" height="30" fill="#D3401B" />
    <circle cx="70" cy="50" r="4" fill="#FEF08A" />
    <circle cx="82" cy="50" r="4" fill="#BBF7D0" />
    <circle cx="94" cy="50" r="4" fill="#BFDBFE" />
    <text x="110" y="54" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">MANIPAL ADMISSIONS 2026-27 | MET APPLICATION</text>

    <!-- Form Mockup Elements -->
    <rect x="75" y="80" width="130" height="16" rx="3" fill="#334155" />
    <rect x="220" y="80" width="145" height="16" rx="3" fill="#334155" />
    <rect x="75" y="105" width="290" height="20" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="1" />
    <text x="85" y="119" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Select Program: B.Tech Computer Science &amp; Engineering</text>

    <rect x="75" y="135" width="135" height="20" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="1" />
    <text x="85" y="149" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">MET Exam Slot 2026</text>

    <rect x="220" y="135" width="145" height="20" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="1" />
    <text x="230" y="149" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Preferred Campus: Manipal</text>

    <!-- Action Button -->
    <rect x="75" y="170" width="140" height="32" rx="6" fill="#16A34A" />
    <text x="145" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">SUBMIT APPLICATION</text>

    <!-- Stand -->
    <polygon points="190,240 250,240 265,270 175,270" fill="#64748B" />
    <rect x="150" y="270" width="140" height="12" rx="4" fill="#475569" />
  </g>

  <!-- Banner Callout -->
  <g transform="translate(40, 40)">
    <rect width="250" height="42" rx="8" fill="#FEF08A" stroke="#EAB308" stroke-width="1.5" />
    <text x="20" y="20" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#854D0E">ADMISSIONS 2026-27 OPEN</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#A16207">Manipal Entrance Test (MET) · 80+ Test Hubs</text>
  </g>
</svg>
