<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 92" width="540" height="92">
  <defs>
    <linearGradient id="christGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="christBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082142"/>
      <stop offset="100%" stop-color="#143B6B"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Crest Shield -->
  <g transform="translate(14, 10)">
    <!-- Outer Shield Frame -->
    <path d="M36 2 C58 2, 68 12, 68 28 C68 50, 48 64, 36 70 C24 64, 4 50, 4 28 C4 12, 14 2, 36 2 Z" 
          fill="url(#christBlue)" stroke="url(#christGold)" stroke-width="2.5" filter="url(#subtleShadow)"/>
    
    <!-- Inner Accent Border -->
    <path d="M36 6 C54 6, 62 14, 62 28 C62 46, 46 58, 36 63 C26 58, 10 46, 10 28 C10 14, 18 6, 36 6 Z" 
          fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>

    <!-- Cross & Radiant Star -->
    <path d="M36 12 L36 34 M25 21 L47 21" stroke="url(#christGold)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="21" r="3" fill="#FFF"/>

    <!-- Open Book of Wisdom -->
    <path d="M22 45 C28 42, 34 44, 36 47 C38 44, 44 42, 50 45 L50 54 C44 51, 38 53, 36 56 C34 53, 28 51, 22 54 Z" 
          fill="#FFF" stroke="#D4AF37" stroke-width="1"/>
    <line x1="36" y1="47" x2="36" y2="56" stroke="#082142" stroke-width="1"/>

    <!-- Small Laurel Wreath base -->
    <path d="M16 38 C14 46, 20 54, 28 58 M56 38 C58 46, 52 54, 44 58" 
          fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(100, 28)">
    <!-- Primary Brand Title -->
    <text x="0" y="0" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="3" fill="#082142">
      CHRIST
    </text>

    <!-- Subtitle / Deemed status -->
    <text x="2" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#6B7280">
      (DEEMED TO BE UNIVERSITY)
    </text>

    <!-- Motto Ribbon & Heritage -->
    <text x="2" y="38" font-family="'Cinzel', 'Georgia', serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#B45309">
      EXCELLENCE AND SERVICE  ·  ESTD. 1969
    </text>

    <!-- Location Indicator -->
    <text x="270" y="38" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.8" fill="#4B5563">
      BENGALURU, INDIA
    </text>
  </g>
</svg>
