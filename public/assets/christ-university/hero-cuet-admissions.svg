<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cuetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cuetBg)"/>

  <!-- Geometric accent lines -->
  <g stroke="#818CF8" stroke-width="1.2" opacity="0.2" fill="none">
    <circle cx="680" cy="200" r="160"/>
    <circle cx="680" cy="200" r="240"/>
    <circle cx="680" cy="200" r="320"/>
  </g>

  <g transform="translate(60, 60)">
    <!-- Header tag -->
    <rect x="0" y="0" width="220" height="28" rx="6" fill="#4F46E5"/>
    <text x="110" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      ADMISSIONS 2026-2027
    </text>

    <!-- Main Title -->
    <text x="0" y="66" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" fill="#FFFFFF">
      Christ University Entrance Test (CUET)
    </text>
    <text x="0" y="96" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#C7D2FE">
      Online Application Portal for Undergraduate, Postgraduate, and Law Programs across all campuses
    </text>

    <!-- Stepper steps -->
    <g transform="translate(0, 130)">
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="20" fill="#6366F1"/>
        <text x="20" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FFF" text-anchor="middle">1</text>
        <text x="50" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">Online Registration</text>
        <text x="50" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#A5B4FC">Fill form &amp; upload credentials</text>
      </g>

      <line x1="230" y1="20" x2="260" y2="20" stroke="#818CF8" stroke-width="2" stroke-dasharray="3 3"/>

      <g transform="translate(280, 0)">
        <circle cx="20" cy="20" r="20" fill="#6366F1"/>
        <text x="20" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FFF" text-anchor="middle">2</text>
        <text x="50" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">CUET Entrance Test</text>
        <text x="50" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#A5B4FC">Proctored computer-based test</text>
      </g>

      <line x1="510" y1="20" x2="540" y2="20" stroke="#818CF8" stroke-width="2" stroke-dasharray="3 3"/>

      <g transform="translate(560, 0)">
        <circle cx="20" cy="20" r="20" fill="#6366F1"/>
        <text x="20" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FFF" text-anchor="middle">3</text>
        <text x="50" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">MP &amp; PI Assessment</text>
        <text x="50" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#A5B4FC">Micro Presentation &amp; Interview</text>
      </g>
    </g>

    <!-- Key Dates Box -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="680" height="90" rx="12" fill="#312E81" stroke="#4338CA" stroke-width="1.5"/>
      <g transform="translate(30, 24)">
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FBBF24">APPLICATION DEADLINE</text>
        <text x="0" y="38" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Session I &amp; II Open</text>
      </g>
      <g transform="translate(250, 24)">
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FBBF24">CUET EXAM MODE</text>
        <text x="0" y="38" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Online Proctored / Centres</text>
      </g>
      <g transform="translate(490, 24)">
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FBBF24">SEATS &amp; SCHOLARSHIPS</text>
        <text x="0" y="38" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Merit &amp; Fee Concessions</text>
      </g>
    </g>
  </g>
</svg>
