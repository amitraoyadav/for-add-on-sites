<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 92" width="540" height="92">
  <defs>
    <linearGradient id="christGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shieldFillDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D54"/>
      <stop offset="100%" stop-color="#1E477A"/>
    </linearGradient>
  </defs>

  <!-- Crest Shield -->
  <g transform="translate(14, 10)">
    <path d="M36 2 C58 2, 68 12, 68 28 C68 50, 48 64, 36 70 C24 64, 4 50, 4 28 C4 12, 14 2, 36 2 Z" 
          fill="url(#shieldFillDark)" stroke="url(#christGoldLight)" stroke-width="2.5"/>
    
    <path d="M36 6 C54 6, 62 14, 62 28 C62 46, 46 58, 36 63 C26 58, 10 46, 10 28 C10 14, 18 6, 36 6 Z" 
          fill="none" stroke="#FDE047" stroke-width="0.8" opacity="0.6"/>

    <path d="M36 12 L36 34 M25 21 L47 21" stroke="url(#christGoldLight)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="21" r="3" fill="#FFF"/>

    <path d="M22 45 C28 42, 34 44, 36 47 C38 44, 44 42, 50 45 L50 54 C44 51, 38 53, 36 56 C34 53, 28 51, 22 54 Z" 
          fill="#FFF" stroke="#FDE047" stroke-width="1"/>
    <line x1="36" y1="47" x2="36" y2="56" stroke="#082142" stroke-width="1"/>

    <path d="M16 38 C14 46, 20 54, 28 58 M56 38 C58 46, 52 54, 44 58" 
          fill="none" stroke="url(#christGoldLight)" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(100, 28)">
    <text x="0" y="0" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="3" fill="#FFFFFF">
      CHRIST
    </text>

    <text x="2" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#E2E8F0">
      (DEEMED TO BE UNIVERSITY)
    </text>

    <text x="2" y="38" font-family="'Cinzel', 'Georgia', serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#FDE047">
      EXCELLENCE AND SERVICE  ·  ESTD. 1969
    </text>

    <text x="270" y="38" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.8" fill="#CBD5E1">
      BENGALURU, INDIA
    </text>
  </g>
</svg>
