<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05162B"/>
      <stop offset="50%" stop-color="#092548"/>
      <stop offset="100%" stop-color="#153A68"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#cuBg)"/>
  <rect width="800" height="500" fill="url(#gridPattern)"/>

  <!-- Architectural Columns / Classical Elevation Silhouette -->
  <g opacity="0.12" stroke="#FFF" stroke-width="1.5" fill="none">
    <path d="M 120 420 L 120 220 L 180 220 L 180 420"/>
    <path d="M 220 420 L 220 180 L 280 180 L 280 420"/>
    <path d="M 320 420 L 320 160 L 380 160 L 380 420"/>
    <path d="M 420 420 L 420 160 L 480 160 L 480 420"/>
    <path d="M 520 420 L 520 180 L 580 180 L 580 420"/>
    <path d="M 620 420 L 620 220 L 680 220 L 680 420"/>
    <!-- Pediment -->
    <path d="M 100 220 L 400 120 L 700 220 Z"/>
    <circle cx="400" cy="170" r="24"/>
  </g>

  <!-- Glowing Sun / Light Beam -->
  <circle cx="400" cy="200" r="180" fill="#3B82F6" opacity="0.15" filter="blur(40px)"/>
  <circle cx="400" cy="200" r="90" fill="#F59E0B" opacity="0.1" filter="blur(20px)"/>

  <!-- Central Crest Symbol -->
  <g transform="translate(365, 80)">
    <path d="M35 5 C55 5, 65 14, 65 28 C65 48, 46 62, 35 68 C24 62, 5 48, 5 28 C5 14, 15 5, 35 5 Z" 
          fill="#0B2A4A" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M35 15 L35 34 M25 24 L45 24" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="35" cy="24" r="3" fill="#FFF"/>
  </g>

  <!-- Main Title -->
  <text x="400" y="195" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    CHRIST (DEEMED TO BE UNIVERSITY)
  </text>
  <text x="400" y="235" font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="600" fill="#FCD34D" text-anchor="middle" letter-spacing="5">
    EXCELLENCE AND SERVICE  ·  BENGALURU
  </text>

  <!-- Subtitle Bar -->
  <rect x="200" y="260" width="400" height="2" fill="url(#goldGlow)"/>
  <text x="400" y="295" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">
    Accredited Grade 'A+' by NAAC · Top 60 in NIRF · Over 55 Years of Educational Eminence
  </text>

  <!-- Stats Grid -->
  <g transform="translate(100, 340)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="135" height="85" rx="10" fill="#0E2E55" stroke="#1E477A" stroke-width="1.5"/>
    <text x="67" y="38" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#FDE047" text-anchor="middle">38,000+</text>
    <text x="67" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Active Students</text>

    <!-- Card 2 -->
    <rect x="155" y="0" width="135" height="85" rx="10" fill="#0E2E55" stroke="#1E477A" stroke-width="1.5"/>
    <text x="222" y="38" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#60A5FA" text-anchor="middle">250+</text>
    <text x="222" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Academic Programs</text>

    <!-- Card 3 -->
    <rect x="310" y="0" width="135" height="85" rx="10" fill="#0E2E55" stroke="#1E477A" stroke-width="1.5"/>
    <text x="377" y="38" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#34D399" text-anchor="middle">6 Campuses</text>
    <text x="377" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Pan-India Presence</text>

    <!-- Card 4 -->
    <rect x="465" y="0" width="135" height="85" rx="10" fill="#0E2E55" stroke="#1E477A" stroke-width="1.5"/>
    <text x="532" y="38" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#F472B6" text-anchor="middle">450+</text>
    <text x="532" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Global Recruiters</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="492" width="800" height="8" fill="#F59E0B"/>
</svg>
