<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="campBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B1A"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F2D54"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#campBg)"/>

  <!-- India / Geographic Nodes Connection Graphic -->
  <g stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" fill="none">
    <path d="M 380 260 L 320 220 L 480 140"/>
    <path d="M 380 260 L 390 280 L 410 320"/>
  </g>

  <!-- Campus Nodes -->
  <!-- Delhi NCR -->
  <g transform="translate(480, 130)">
    <circle cx="0" cy="0" r="18" fill="#10B981" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="18" y="5" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Delhi NCR Campus</text>
    <text x="18" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#A7F3D0">Ghaziabad (Mariam Nagar)</text>
  </g>

  <!-- Pune Lavasa -->
  <g transform="translate(260, 200)">
    <circle cx="0" cy="0" r="18" fill="#10B981" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="-160" y="5" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pune Lavasa Campus</text>
    <text x="-160" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#A7F3D0">The Hub of Analytics</text>
  </g>

  <!-- Bengaluru Campuses cluster -->
  <g transform="translate(390, 310)">
    <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.25"/>
    <circle cx="0" cy="0" r="12" fill="#FBBF24"/>
    <text x="24" y="-12" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#FDE68A">BENGALURU HEADQUARTERS</text>
    <text x="24" y="6" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">· Central Campus (Hosur Rd)</text>
    <text x="24" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">· Kengeri Campus (Tech & Arch)</text>
    <text x="24" y="38" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">· Bannerghatta Road Campus</text>
    <text x="24" y="54" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">· Yeshwanthpur Campus</text>
  </g>

  <!-- Title Top -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="80" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">PAN-INDIA FOOTPRINT</text>
    <text x="0" y="52" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" fill="#FFFFFF">Six World-Class Campuses</text>
    <text x="0" y="76" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Equipped with smart amphitheatres, cutting-edge labs, green estates, and collegiate residences</text>
  </g>
</svg>
