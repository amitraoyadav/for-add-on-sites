<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041d54" />
      <stop offset="65%" stop-color="#0f3b82" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#bgSky)" rx="16" />

  <!-- Architectural Modern Geometric Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
  </g>

  <!-- Ambient Light Circles -->
  <circle cx="500" cy="80" r="160" fill="url(#goldGlow)" opacity="0.12" filter="blur(30px)" />
  <circle cx="120" cy="340" r="140" fill="#38bdf8" opacity="0.15" filter="blur(25px)" />

  <!-- Architectural Silhouette of IPU Dwarka Admin Tower & Academic Blocks -->
  <g transform="translate(0, 160)" opacity="0.25">
    <rect x="40" y="70" width="85" height="170" fill="#ffffff" rx="2" />
    <rect x="140" y="30" width="110" height="210" fill="#ffffff" rx="3" />
    <rect x="270" y="80" width="95" height="160" fill="#ffffff" rx="2" />
    <rect x="380" y="10" width="130" height="230" fill="#ffffff" rx="4" />
    <rect x="525" y="60" width="60" height="180" fill="#ffffff" rx="2" />
  </g>

  <!-- Ground Landscape Deck -->
  <path d="M0 320 Q300 290 600 320 L600 400 L0 400 Z" fill="#031336" />
  <line x1="0" y1="322" x2="600" y2="322" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" />

  <!-- Central Visual Showcase Card -->
  <rect x="45" y="45" width="510" height="295" rx="14" fill="url(#glassCard)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />

  <!-- Top Badges Row -->
  <rect x="65" y="65" width="145" height="28" rx="14" fill="#041d54" stroke="#fbbf24" stroke-width="1" />
  <circle cx="79" cy="79" r="6" fill="#fbbf24" />
  <text x="92" y="83" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">NAAC GRADE A++</text>

  <rect x="220" y="65" width="135" height="28" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
  <text x="232" y="83" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#93c5fd">NIRF TOP 75 · GOVT. NCT</text>

  <rect x="365" y="65" width="170" height="28" rx="14" fill="#065f46" stroke="#34d399" stroke-width="1" />
  <text x="377" y="83" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">IPU CET 2026 ADMISSIONS</text>

  <!-- University Title & Tagline -->
  <text x="65" y="132" font-family="'Georgia', serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="0.5">Guru Gobind Singh</text>
  <text x="65" y="165" font-family="'Georgia', serif" font-size="25" font-weight="900" fill="#fbbf24" letter-spacing="0.5">Indraprastha University</text>
  
  <text x="65" y="196" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">
    Dual Campuses: 60-Acre Dwarka &amp; 18.75-Acre East Delhi (Surajmal Vihar)
  </text>
  <text x="65" y="216" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">
    15 University Schools of Studies · 120+ Affiliated Premier Colleges · 100,000+ Students
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(65, 238)">
    <rect x="0" y="0" width="108" height="60" rx="8" fill="rgba(10, 37, 64, 0.7)" stroke="rgba(255,255,255,0.15)" />
    <text x="12" y="26" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">15</text>
    <text x="12" y="44" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">University Schools</text>

    <rect x="120" y="0" width="108" height="60" rx="8" fill="rgba(10, 37, 64, 0.7)" stroke="rgba(255,255,255,0.15)" />
    <text x="132" y="26" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#fbbf24">120+</text>
    <text x="132" y="44" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Affiliated Colleges</text>

    <rect x="240" y="0" width="108" height="60" rx="8" fill="rgba(10, 37, 64, 0.7)" stroke="rgba(255,255,255,0.15)" />
    <text x="252" y="26" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#34d399">₹45 LPA</text>
    <text x="252" y="44" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Highest Package</text>

    <rect x="360" y="0" width="110" height="60" rx="8" fill="rgba(10, 37, 64, 0.7)" stroke="rgba(255,255,255,0.15)" />
    <text x="372" y="26" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#f43f5e">3.56 CGPA</text>
    <text x="372" y="44" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">NAAC A++ Grade</text>
  </g>
</svg>
