<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="triCityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="40%" stop-color="#1C2541"/>
      <stop offset="80%" stop-color="#3A1020"/>
      <stop offset="100%" stop-color="#120408"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#triCityBg)"/>
  
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
  </g>

  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="260" height="36" rx="18" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="24" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FBBF24">
      GLOBAL IMMERSION MODEL
    </text>

    <text x="0" y="85" font-family="'Cinzel', 'Playfair Display', serif" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="1">
      ONE DEGREE.
    </text>
    <text x="0" y="145" font-family="'Cinzel', 'Playfair Display', serif" font-size="52" font-weight="800" fill="#F5D061">
      THREE GLOBAL CITIES.
    </text>

    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#E2E8F0">
      Live and study across Dubai, Singapore and Sydney.
    </text>
    <text x="0" y="225" font-family="'Inter', sans-serif" font-size="15" font-weight="300" fill="#94A3B8">
      Gain cross-cultural leadership skills and graduate with an Australian accredited degree.
    </text>

    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="150" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#F5D061" stroke-width="1"/>
      <text x="75" y="25" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#FFFFFF">DUBAI</text>
      <text x="75" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#F5D061">Year 1 &amp; Middle East</text>

      <rect x="170" y="0" width="150" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#F5D061" stroke-width="1"/>
      <text x="245" y="25" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#FFFFFF">SINGAPORE</text>
      <text x="245" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#F5D061">Year 2 &amp; Asian Hub</text>

      <rect x="340" y="0" width="150" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#F5D061" stroke-width="1"/>
      <text x="415" y="25" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#FFFFFF">SYDNEY</text>
      <text x="415" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#F5D061">Year 3–4 &amp; Post-Study</text>
    </g>
  </g>

  <g transform="translate(850, 150)">
    <circle cx="100" cy="140" r="140" fill="#1C2541" fill-opacity="0.5" stroke="#F5D061" stroke-width="1"/>
    <path d="M40 90 Q100 40 160 110 Q140 190 70 200 Z" fill="none" stroke="#F5D061" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="40" cy="90" r="8" fill="#F59E0B"/>
    <text x="40" y="75" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Dubai</text>

    <circle cx="160" cy="110" r="8" fill="#10B981"/>
    <text x="160" y="95" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Singapore</text>

    <circle cx="90" cy="210" r="8" fill="#3B82F6"/>
    <text x="90" y="235" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Sydney</text>
  </g>
</svg>
