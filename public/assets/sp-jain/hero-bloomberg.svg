      <text x="80" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">#7 Asia-Pacific</text>

      <rect x="175" y="0" width="165" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#D4AF37" stroke-width="1"/>
      <text x="257" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Forbes Top 15 World</text>

      <rect x="355" y="0" width="165" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#D4AF37" stroke-width="1"/>
      <text x="437" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">THE-WSJ Top 4</text>
