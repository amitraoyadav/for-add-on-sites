    <text x="100" y="175" text-anchor="middle" font-family="'Cinzel', serif" font-size="64" font-weight="800" fill="#FFFFFF">#7</text>
    <text x="100" y="205" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5D061" letter-spacing="1">ASIA-PACIFIC</text>
