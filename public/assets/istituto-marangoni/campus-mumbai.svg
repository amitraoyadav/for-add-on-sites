<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="mumbaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19161a"/>
      <stop offset="100%" stop-color="#09070a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mumbaiGrad)"/>
  <!-- Ceejay House Worli facade & Bandra-Worli Sea Link cable silhouette -->
  <g stroke="#E879F9" stroke-width="1.2" opacity="0.85" fill="none">
    <!-- Sea Link pylon & stay cables -->
    <path d="M 470 340 L 490 100 L 510 340" stroke="#D4AF37" stroke-width="1.8"/>
    <line x1="490" y1="120" x2="380" y2="340" stroke="#E879F9" stroke-width="0.8"/>
    <line x1="490" y1="160" x2="410" y2="340" stroke="#E879F9" stroke-width="0.8"/>
    <line x1="490" y1="200" x2="440" y2="340" stroke="#E879F9" stroke-width="0.8"/>
    <!-- Ceejay House contemporary luxury building in Worli -->
    <rect x="90" y="140" width="240" height="200" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="90" y1="190" x2="330" y2="190" stroke="#D4AF37"/>
    <line x1="90" y1="240" x2="330" y2="240" stroke="#D4AF37"/>
    <line x1="90" y1="290" x2="330" y2="290" stroke="#D4AF37"/>
    <text x="210" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#FFFFFF">CEEJAY HOUSE · WORLI</text>
    <line x1="0" y1="340" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <text x="300" y="375" text-anchor="middle" font-family="'Didot', serif" font-size="18" font-weight="700" letter-spacing="3" fill="#D4AF37">MUMBAI · WORLI LUXURY HUB</text>
</svg>
