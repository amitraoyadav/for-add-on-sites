<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="fragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161214"/>
      <stop offset="100%" stop-color="#090608"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#fragGrad)"/>

  <!-- High-luxury faceted perfume bottle & aromatic notes -->
  <g stroke="#F472B6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Flacon stopper -->
    <rect x="260" y="100" width="80" height="50" rx="3" stroke="#D4AF37" stroke-width="2"/>
    <rect x="280" y="150" width="40" height="25" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Flacon body -->
    <path d="M 210 220 L 230 175 L 370 175 L 390 220 L 410 420 C 410 440 390 450 370 450 L 230 450 C 210 450 190 440 190 420 Z" stroke="#D4AF37" stroke-width="2"/>
    <!-- Facet reflections -->
    <line x1="240" y1="210" x2="240" y2="420" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="360" y1="210" x2="360" y2="420" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="240" y="270" width="120" height="90" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="300" y="320" text-anchor="middle" font-family="'Didot', serif" font-size="14" font-weight="700" fill="#D4AF37">MILANO</text>
  </g>

  <text x="300" y="555" text-anchor="middle" font-family="'Didot', 'Playfair Display', serif" font-size="26" font-weight="700" letter-spacing="3" fill="#FFFFFF">
    FRAGRANCES &amp; COSMETICS
  </text>
  <text x="300" y="580" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#F472B6">
    BRAND MANAGEMENT · OLFACTORY CREATION
  </text>
</svg>
