<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="designGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#designGrad)"/>

  <!-- Architectural Isometric Chair / Living Form -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Perspective lines -->
    <path d="M 180 340 L 300 240 L 420 340 L 300 440 Z" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M 300 240 L 300 120 L 420 220 L 420 340" />
    <path d="M 180 340 L 180 220 L 300 120" />
    <!-- Interior architectural arches -->
    <path d="M 220 200 A 80 80 0 0 1 380 200" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 240 200 A 60 60 0 0 1 360 200" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Product wireframe arcs -->
    <ellipse cx="300" cy="340" rx="90" ry="40" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 4"/>
  </g>

  <text x="300" y="555" text-anchor="middle" font-family="'Didot', 'Playfair Display', serif" font-size="28" font-weight="700" letter-spacing="4" fill="#FFFFFF">
    DESIGN
  </text>
  <text x="300" y="580" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#38BDF8">
    INTERIOR · PRODUCT · VISUAL
  </text>
</svg>
