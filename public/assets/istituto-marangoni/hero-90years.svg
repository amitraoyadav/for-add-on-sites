<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" fill="none">
  <defs>
    <linearGradient id="hero90Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="runwayGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#222228" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="1600" height="780" fill="url(#hero90Grad)"/>
  <rect width="1600" height="780" fill="url(#goldGlow)"/>
  <rect width="1600" height="780" fill="url(#runwayGrid)"/>

  <!-- High-fashion couture silhouette lines -->
  <path d="M 800 120 C 740 220, 710 380, 680 720" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <path d="M 800 120 C 860 220, 890 380, 920 720" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <path d="M 720 300 C 800 360, 880 360, 960 300" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4" fill="none"/>
  <path d="M 660 480 C 800 560, 940 560, 1080 480" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>

  <!-- Stylized mannequin / draped fabric curves -->
  <path d="M 500 780 C 600 500, 750 200, 800 140 C 850 200, 1000 500, 1100 780" fill="#181822" fill-opacity="0.4" stroke="#D4AF37" stroke-width="0.5"/>

  <!-- Editorial typography accents -->
  <text x="800" y="240" text-anchor="middle" font-family="'Didot', 'Playfair Display', serif" font-size="20" font-weight="400" letter-spacing="12" fill="#D4AF37">
    MILANO · FIRENZE · PARIS · LONDON · DUBAI · MIAMI · MUMBAI
  </text>
  <text x="800" y="360" text-anchor="middle" font-family="'Didot', 'Playfair Display', serif" font-size="76" font-weight="700" letter-spacing="4" fill="#FFFFFF">
    CELEBRATING 90 YEARS
  </text>
  <text x="800" y="440" text-anchor="middle" font-family="'Didot', 'Playfair Display', serif" font-size="44" font-weight="300" letter-spacing="8" fill="#E5E5E5">
    OF ITALIAN LUXURY CREATIVITY
  </text>
  <text x="800" y="510" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="400" letter-spacing="3" fill="#A3A3A3">
    SINCE 1935 · SHAPING THE GLOBAL LEADERS OF FASHION, DESIGN &amp; ART
  </text>
  
  <rect x="730" y="560" width="140" height="40" rx="0" fill="#D4AF37" fill-opacity="0.15" stroke="#D4AF37" stroke-width="1"/>
  <text x="800" y="585" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#D4AF37">
    1935 — 2025
  </text>
</svg>
