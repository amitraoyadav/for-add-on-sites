<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="sartoriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181a"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#sartoriGrad)"/>
  <!-- Bespoke Sartorial tailoring lapels & Oasi Zegna cashmere aesthetic -->
  <circle cx="200" cy="110" r="42" fill="#1e2428" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M 110 480 L 150 200 L 200 160 L 250 200 L 290 480 Z" fill="#1c242a" stroke="#D4AF37" stroke-width="1.2"/>
  <!-- Double-breasted peak lapels -->
  <polygon points="150,200 200,280 180,310 130,220" fill="#2d3748" stroke="#38BDF8" stroke-width="1"/>
  <polygon points="250,200 200,280 220,310 270,220" fill="#2d3748" stroke="#38BDF8" stroke-width="1"/>
  
  <text x="200" y="420" text-anchor="middle" font-family="'Didot', serif" font-size="22" font-weight="700" fill="#FFFFFF">ALESSANDRO SARTORI</text>
  <text x="200" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#38BDF8">ARTISTIC DIRECTOR, ZEGNA</text>
  <text x="200" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#A1A1AA">Distinguished Alumnus · Milan</text>
</svg>
