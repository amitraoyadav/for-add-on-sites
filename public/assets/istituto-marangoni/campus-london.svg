<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="londonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#londonGrad)"/>
  <!-- Shoreditch brick warehouse industrial architecture & Big Ben clock tower -->
  <g stroke="#38BDF8" stroke-width="1.2" opacity="0.85" fill="none">
    <!-- Clock tower outline -->
    <rect x="80" y="80" width="70" height="260" stroke="#D4AF37" stroke-width="1.5"/>
    <polygon points="80,80 115,20 150,80" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="115" cy="115" r="18" stroke="#FFFFFF"/>
    <!-- Shoreditch industrial studio windows -->
    <rect x="200" y="120" width="340" height="220" stroke="#94A3B8"/>
    <g stroke="#64748B" stroke-width="0.8">
      <rect x="230" y="150" width="70" height="60"/>
      <rect x="330" y="150" width="70" height="60"/>
      <rect x="430" y="150" width="70" height="60"/>
      <rect x="230" y="240" width="70" height="60"/>
      <rect x="330" y="240" width="70" height="60"/>
      <rect x="430" y="240" width="70" height="60"/>
    </g>
    <line x1="0" y1="340" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <text x="300" y="375" text-anchor="middle" font-family="'Didot', serif" font-size="18" font-weight="700" letter-spacing="3" fill="#D4AF37">LONDON · SHOREDITCH</text>
</svg>
