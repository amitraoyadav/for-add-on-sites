<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="dubaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14191c"/>
      <stop offset="100%" stop-color="#05080a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#dubaiGrad)"/>
  <!-- DIFC Gate Building and Burj Khalifa futuristic skyline -->
  <g stroke="#38BDF8" stroke-width="1.2" opacity="0.85" fill="none">
    <!-- Burj Khalifa central spire -->
    <path d="M 460 340 L 485 200 L 490 80 L 495 20 L 500 20 L 505 80 L 510 200 L 535 340" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- DIFC Gate structure -->
    <rect x="100" y="140" width="280" height="200" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="170" y="210" width="140" height="130" stroke="#FFFFFF" stroke-opacity="0.7"/>
    <line x1="0" y1="340" x2="600" y2="340" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <text x="300" y="375" text-anchor="middle" font-family="'Didot', serif" font-size="18" font-weight="700" letter-spacing="3" fill="#D4AF37">DUBAI · DIFC GATE DISTRICT</text>
</svg>
