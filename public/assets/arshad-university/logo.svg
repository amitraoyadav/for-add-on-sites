    <path d="M34 2 C52 2 68 12 68 34 C68 56 46 66 34 70 C22 66 0 56 0 34 C0 12 16 2 34 2 Z" fill="#F37021" />
    <path d="M34 6 C49 6 63 15 63 34 C63 52 44 61 34 65 C24 61 5 52 5 34 C5 15 19 6 34 6 Z" fill="#1C1D21" />
    
    <!-- Rising Sun / Knowledge Rays -->
    <path d="M34 16 L34 24" stroke="#F37021" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 20 L27 26" stroke="#F37021" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M46 20 L41 26" stroke="#F37021" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M14 30 L22 32" stroke="#F37021" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M54 30 L46 32" stroke="#F37021" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Open Book & Torch Emblem -->
    <path d="M20 40 C26 37 31 38 34 41 C37 38 42 37 48 40 L48 53 C42 50 37 51 34 54 C31 51 26 50 20 53 Z" fill="#FFFFFF"/>
    <path d="M34 41 L34 54" stroke="#F37021" stroke-width="1.8"/>

