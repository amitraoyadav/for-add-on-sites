    <path d="M34 27 C36 29 38 31 37 34 C36 37 32 37 31 34 C30 31 32 29 34 27 Z" fill="#FBBF24"/>
    <path d="M34 29 C35 30 36 32 35 33 C34 35 33 35 32 33 C32 32 33 30 34 29 Z" fill="#EF4444"/>
  </g>

  <!-- Typography -->
  <g transform="translate(90, 18)">
    <text x="0" y="26" font-family="'Poppins', 'Inter', 'Montserrat', sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#18181B">
      ARSHAD
    </text>
    <text x="0" y="44" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="3.8" fill="#F37021">
      UNIVERSITY
    </text>
    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.8" fill="#71717A">
