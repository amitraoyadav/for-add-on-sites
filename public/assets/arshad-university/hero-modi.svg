<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradModi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGradModi)"/>
  <circle cx="950" cy="250" r="380" fill="url(#sunGlow)"/>

  <!-- Architectural Background Elements -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M0 500 L1200 500"/>
    <path d="M0 450 L1200 450"/>
    <path d="M150 200 L150 500 M300 150 L300 500 M450 180 L450 500 M600 140 L600 500 M750 160 L750 500 M900 180 L900 500 M1050 220 L1050 500"/>
    <circle cx="600" cy="140" r="120"/>
  </g>

  <!-- Left Content Plaque -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect width="320" height="36" rx="18" fill="#F37021" fill-opacity="0.2" stroke="#F37021" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#F37021"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FDBA74">
      HISTORIC VISIT BY PRIME MINISTER
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Hon'ble PM Narendra Modi
    </text>
    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#F97316">
      Inaugurated Indian Science Congress
    </text>
    <text x="0" y="180" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="#E4E4E7">
      at Arshad University Campus
    </text>

    <!-- Subtitle & Quote -->
    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#A1A1AA">
      "Future belongs to nations that invest in research, science, and youth innovation."
    </text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#71717A">
      Addressed over 30,000 scientists, Nobel laureates, and young researchers across the nation.
    </text>

    <!-- Highlight Stats Bar -->
    <g transform="translate(0, 300)">
      <rect width="520" height="80" rx="12" fill="#27272A" fill-opacity="0.8" stroke="#3F3F46" stroke-width="1"/>
      <g transform="translate(25, 20)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="24" font-weight="800" fill="#F97316">6+ Nobel Laureates</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">Shared Stage at Campus</text>
      </g>
      <line x1="220" y1="15" x2="220" y2="65" stroke="#3F3F46"/>
      <g transform="translate(245, 20)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">30,000+ Delegates</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#A1A1AA">From 60+ Countries</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Feature (Stylized Stage & Heraldic Dais) -->
  <g transform="translate(720, 90)">
    <rect width="400" height="420" rx="24" fill="#27272A" stroke="#F97316" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="20" y="20" width="360" height="240" rx="16" fill="#18181B"/>

    <!-- Dais & Mic Icon Illustration -->
    <g transform="translate(200, 140)">
      <circle cx="0" cy="0" r="45" fill="#F37021" fill-opacity="0.15" stroke="#F37021" stroke-width="2"/>
      <!-- Podium -->
      <path d="M-22 15 L22 15 L14 45 L-14 45 Z" fill="#F37021"/>
      <!-- Microphone -->
      <rect x="-4" y="-20" width="8" height="18" rx="4" fill="#FFFFFF"/>
      <path d="M-9 -10 C-9 0 9 0 9 -10" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Plaque Text -->
    <text x="200" y="300" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
      106th INDIAN SCIENCE CONGRESS
    </text>
    <text x="200" y="325" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F97316">
      Hosted at Arshad University
    </text>
    <text x="200" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA">
      "Future India: Science &amp; Technology"
    </text>
    <rect x="120" y="375" width="160" height="26" rx="13" fill="#F37021" fill-opacity="0.2"/>
    <text x="200" y="392" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FDBA74">
      GLOBAL DIGNITARY ARCHIVE
    </text>
  </g>
</svg>
