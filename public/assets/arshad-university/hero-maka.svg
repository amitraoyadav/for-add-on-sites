<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradMaka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31102A"/>
      <stop offset="50%" stop-color="#4A154B"/>
      <stop offset="100%" stop-color="#19061C"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#31102A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradMaka)"/>
  <circle cx="900" cy="260" r="330" fill="url(#purpleGlow)"/>

  <!-- Left Content Plaque -->
  <g transform="translate(80, 100)">
    <rect width="320" height="36" rx="18" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#EC4899"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FBCFE8">
      NATIONAL SPORTS EXCELLENCE
    </text>

    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      MAKA TROPHY
    </text>
    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#F472B6">
      1st Runner Up Across All India
    </text>
    <text x="0" y="180" font-family="'Poppins', sans-serif" font-size="26" font-weight="600" fill="#FDF2F8">
      Maulana Abul Kalam Azad Trophy
    </text>

    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#F5D0FE">
      Conferred by the President of India for the country's most premier sports performance.
    </text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#E879F9">
      Proud alma mater of Olympic Gold Medalist Neeraj Chopra and 12+ Tokyo/Paris Olympians.
    </text>

    <!-- Metrics Plaque -->
    <g transform="translate(0, 295)">
      <rect width="520" height="90" rx="12" fill="#4A154B" fill-opacity="0.9" stroke="#701A75" stroke-width="1"/>
      <g transform="translate(25, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#F472B6">MAKA</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#FBCFE8">National Award</text>
      </g>
      <line x1="160" y1="15" x2="160" y2="75" stroke="#701A75"/>
      <g transform="translate(185, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">12+ Olympians</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#FBCFE8">Represented India</text>
      </g>
      <line x1="340" y1="15" x2="340" y2="75" stroke="#701A75"/>
      <g transform="translate(365, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#FBBF24">Olympic Gold</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#FBCFE8">Neeraj Chopra Alumnus</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Feature (MAKA Trophy Graphic) -->
  <g transform="translate(740, 100)">
    <rect width="380" height="400" rx="24" fill="#4A154B" stroke="#F472B6" stroke-width="2" stroke-opacity="0.3"/>
    
    <g transform="translate(190, 120)">
      <circle cx="0" cy="0" r="60" fill="#EC4899" fill-opacity="0.2" stroke="#F472B6" stroke-width="2"/>
      <!-- Trophy Icon -->
      <path d="M-20 -25 L20 -25 L16 10 C16 22 0 25 0 25 C0 25 -16 22 -16 10 Z" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
      <!-- Handles -->
      <path d="M-20 -15 C-32 -15 -32 5 -16 8" stroke="#FBBF24" stroke-width="3" fill="none"/>
      <path d="M20 -15 C32 -15 32 5 16 8" stroke="#FBBF24" stroke-width="3" fill="none"/>
      <!-- Base -->
      <path d="M-6 25 L6 25 L10 38 L-10 38 Z" fill="#D97706"/>
      <rect x="-18" y="38" width="36" height="8" rx="2" fill="#78350F"/>
    </g>

    <text x="190" y="225" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
      MAULANA ABUL KALAM AZAD
    </text>
    <text x="190" y="250" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F472B6">
      Highest Sports Honor in India
    </text>
    <text x="190" y="280" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#E879F9">
      Conferred by the President of India
    </text>

    <rect x="90" y="315" width="200" height="34" rx="17" fill="#EC4899" fill-opacity="0.2"/>
    <text x="190" y="337" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FDF2F8">
      ATHLETIC EXCELLENCE
    </text>
  </g>
</svg>
