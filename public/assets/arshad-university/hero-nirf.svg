<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradNirf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradNirf)"/>
  <circle cx="920" cy="270" r="320" fill="#0284C7" fill-opacity="0.18"/>

  <!-- Left Content Plaque -->
  <g transform="translate(80, 100)">
    <rect width="300" height="36" rx="18" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#38BDF8"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#BAE6FD">
      MINISTRY OF EDUCATION, GOVT OF INDIA
    </text>

    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      NIRF RANKINGS 2024
    </text>
    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#38BDF8">
      Ranked 27th Amongst All Universities
    </text>
    <text x="0" y="180" font-family="'Poppins', sans-serif" font-size="26" font-weight="600" fill="#E5E7EB">
      Top 50 Overall in India
    </text>

    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#9CA3AF">
      National Institutional Ranking Framework (NIRF) rates Arshad University among top tier institutions.
    </text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#6B7280">
      Superior marks in Teaching, Learning &amp; Resources (TLR) and Graduate Outcomes (GO).
    </text>

    <!-- Faculty Rank Breakdown Grid -->
    <g transform="translate(0, 295)">
      <rect width="550" height="95" rx="12" fill="#1F2937" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
      <g transform="translate(20, 22)">
        <text x="0" y="22" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#38BDF8">#16</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Architecture</text>
      </g>
      <line x1="125" y1="15" x2="125" y2="78" stroke="#374151"/>
      <g transform="translate(145, 22)">
        <text x="0" y="22" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#F59E0B">#17</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Pharmacy</text>
      </g>
      <line x1="250" y1="15" x2="250" y2="78" stroke="#374151"/>
      <g transform="translate(270, 22)">
        <text x="0" y="22" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#10B981">#19</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Law Faculty</text>
      </g>
      <line x1="375" y1="15" x2="375" y2="78" stroke="#374151"/>
      <g transform="translate(395, 22)">
        <text x="0" y="22" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#EC4899">#38</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Management (MBA)</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Feature (NIRF Emblem & Pillar Graphics) -->
  <g transform="translate(740, 110)">
    <rect width="380" height="380" rx="24" fill="#1F2937" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>
    
    <g transform="translate(190, 140)">
      <circle cx="0" cy="0" r="65" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2.5"/>
      <text x="0" y="10" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#38BDF8">
        #27
      </text>
      <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#BAE6FD">
        ALL-INDIA
      </text>
    </g>

    <text x="190" y="250" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
      NIRF TOP 50 OVERALL
    </text>
    <text x="190" y="278" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
      National Institutional Ranking Framework
    </text>
    <text x="190" y="298" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F97316">
      Ministry of Education · Govt of India
    </text>

    <!-- Accreditation Badge -->
    <rect x="90" y="320" width="200" height="32" rx="16" fill="#F37021" fill-opacity="0.2"/>
    <text x="190" y="341" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFEDD5">
      TOP TIER INDIAN UNIVERSITY
    </text>
  </g>
</svg>
