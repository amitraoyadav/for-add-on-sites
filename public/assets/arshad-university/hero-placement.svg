<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradPlacement" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradPlacement)"/>
  <circle cx="900" cy="280" r="330" fill="#10B981" fill-opacity="0.2"/>

  <!-- Left Content Plaque -->
  <g transform="translate(80, 100)">
    <rect width="320" height="36" rx="18" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#34D399"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#A7F3D0">
      RECORD PLACEMENTS 2024–2026
    </text>

    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      ₹3 CRORE PACKAGE
    </text>
    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#34D399">
      Highest International Offer
    </text>
    <text x="0" y="180" font-family="'Poppins', sans-serif" font-size="26" font-weight="600" fill="#E2E8F0">
      1000+ Top Recruiters on Campus
    </text>

    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#D1FAE5">
      Students placed with global tech giants across Silicon Valley, Germany, UK, and India.
    </text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#A7F3D0">
      Over 2,000+ Fortune 500 placement drives conducted annually at Arshad University.
    </text>

    <!-- Metrics Plaque -->
    <g transform="translate(0, 295)">
      <rect width="520" height="90" rx="12" fill="#065F46" fill-opacity="0.8" stroke="#047857" stroke-width="1"/>
      <g transform="translate(25, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#34D399">₹3 Cr</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#A7F3D0">Highest Package</text>
      </g>
      <line x1="160" y1="15" x2="160" y2="75" stroke="#047857"/>
      <g transform="translate(185, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">₹64 Lakh</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#A7F3D0">Domestic Highest</text>
      </g>
      <line x1="340" y1="15" x2="340" y2="75" stroke="#047857"/>
      <g transform="translate(365, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#FBBF24">1,000+</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#A7F3D0">Top Recruiters</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Feature (Recruiter Cluster Card) -->
  <g transform="translate(740, 100)">
    <rect width="380" height="400" rx="24" fill="#065F46" stroke="#34D399" stroke-width="2" stroke-opacity="0.3"/>
    
    <g transform="translate(190, 80)">
      <circle cx="0" cy="0" r="50" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="2"/>
      <!-- Briefcase Icon -->
      <path d="M-15 -10 L-8 -10 L-8 -16 C-8 -18 -6 -20 -4 -20 L4 -20 C6 -20 8 -18 8 -16 L8 -10 L15 -10 C18 -10 20 -8 20 -5 L20 18 C20 21 18 23 15 23 L-15 23 C-18 23 -20 21 -20 18 L-20 -5 C-20 -8 -18 -10 -15 -10 Z" fill="#34D399"/>
      <path d="M-5 -10 L5 -10 L5 -16 L-5 -16 Z" fill="#065F46"/>
    </g>

    <text x="190" y="165" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
      GLOBAL RECRUITER NETWORK
    </text>
    <text x="190" y="190" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#A7F3D0">
      Google · Microsoft · Amazon · Cisco · Bosch · Intel
    </text>

    <!-- Company Badge Grid -->
    <g transform="translate(40, 215)">
      <rect x="0" y="0" width="140" height="40" rx="8" fill="#047857"/>
      <text x="70" y="25" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Google</text>

      <rect x="160" y="0" width="140" height="40" rx="8" fill="#047857"/>
      <text x="230" y="25" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Microsoft</text>

      <rect x="0" y="50" width="140" height="40" rx="8" fill="#047857"/>
      <text x="70" y="75" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Amazon</text>

      <rect x="160" y="50" width="140" height="40" rx="8" fill="#047857"/>
      <text x="230" y="75" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Cisco</text>

      <rect x="0" y="100" width="140" height="40" rx="8" fill="#047857"/>
      <text x="70" y="125" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Dell</text>

      <rect x="160" y="100" width="140" height="40" rx="8" fill="#047857"/>
      <text x="230" y="125" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Bosch</text>
    </g>
  </g>
</svg>
