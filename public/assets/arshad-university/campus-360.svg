<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="bgGrad360" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="40%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="campusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F37021" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bgGrad360)"/>
  <circle cx="600" cy="240" r="300" fill="url(#campusGlow)"/>

  <!-- Compass & 360 Interactive Overlay Graphic -->
  <g transform="translate(600, 220)">
    <!-- 360 Outer Ring -->
    <circle cx="0" cy="0" r="110" stroke="#F37021" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
    <circle cx="0" cy="0" r="80" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" fill="#18181B" fill-opacity="0.8"/>

    <!-- 360 Degree Rotational Arrows -->
    <path d="M-50 -15 C-50 -45 50 -45 50 -15" stroke="#F37021" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="56,-12 44,-10 50,-24" fill="#F37021"/>

    <path d="M50 15 C50 45 -50 45 -50 15" stroke="#F37021" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="-56,12 -44,10 -50,24" fill="#F37021"/>

    <text x="0" y="8" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">
      360°
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#FDBA74">
      VIRTUAL TOUR
    </text>
  </g>

  <!-- Title & Description Overlay -->
  <text x="600" y="80" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">
    EXPLORE ARSHAD UNIVERSITY CAMPUS IN 360°
  </text>
  <text x="600" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" fill="#A1A1AA">
    Experience India's largest 600-acre hi-tech residential campus from the comfort of your home
  </text>

  <!-- Bottom Interactive Nav Hotspots -->
  <g transform="translate(350, 390)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="75" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E4E4E7">
      🏫 Academic Blocks
    </text>

    <rect x="175" y="0" width="150" height="36" rx="18" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="250" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E4E4E7">
      🏟️ Olympic Sports
    </text>

    <rect x="350" y="0" width="150" height="36" rx="18" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="425" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E4E4E7">
      🏢 Uni-Mall &amp; Living
    </text>
  </g>
</svg>
