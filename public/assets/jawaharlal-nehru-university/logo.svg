<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="jnuBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2847" />
      <stop offset="100%" stop-color="#09182B" />
    </linearGradient>
    <linearGradient id="jnuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- JNU Emblem Icon -->
  <g transform="translate(15, 10)">
    <!-- Circular Crest Base -->
    <circle cx="50" cy="50" r="48" fill="url(#jnuBlue)" filter="drop-shadow(0 4px 6px rgba(15,40,71,0.35))" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#jnuGold)" stroke-width="2" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 2" />

    <!-- Central Flame of Knowledge & Atom Orbit Rings -->
    <!-- Orbit 1 -->
    <ellipse cx="50" cy="50" rx="30" ry="12" fill="none" stroke="#93C5FD" stroke-width="1.2" transform="rotate(30 50 50)" />
    <!-- Orbit 2 -->
    <ellipse cx="50" cy="50" rx="30" ry="12" fill="none" stroke="#93C5FD" stroke-width="1.2" transform="rotate(-30 50 50)" />
    <!-- Orbit 3 -->
    <ellipse cx="50" cy="50" rx="30" ry="12" fill="none" stroke="#FBBF24" stroke-width="1.2" transform="rotate(90 50 50)" />

    <!-- Center Lamp / Torch Flame -->
    <path d="M50 25 C54 35 59 40 57 48 C55 54 52 57 50 58 C48 57 45 54 43 48 C41 40 46 35 50 25 Z" fill="#F59E0B" />
    <path d="M50 33 C52 39 55 42 54 47 C53 50 51 52 50 53 C49 52 47 50 46 47 C45 42 48 39 50 33 Z" fill="#FDE68A" />

    <!-- Open Book Base -->
    <path d="M35 62 Q50 57 50 64 Q50 57 65 62 L63 67 Q50 62 50 69 Q50 62 37 67 Z" fill="#FFFFFF" />

    <!-- Mini Stars -->
    <circle cx="28" cy="48" r="1.5" fill="#F59E0B" />
    <circle cx="72" cy="48" r="1.5" fill="#F59E0B" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="25" font-weight="900" letter-spacing="2" fill="#0F2847">JAWAHARLAL NEHRU UNIVERSITY</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#DC2626">जवाहरलाल नेहरू विश्वविद्यालय, नई दिल्ली</text>
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#475569">A Central University Accredited NAAC Grade "A++" (3.77 CGPA) · NIRF #2 in India</text>
    <rect x="0" y="79" width="310" height="19" rx="3.5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="8" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.5" fill="#1E40AF">★ ज्ञानं विज्ञानं सहितं यज्ज्ञात्वा मोक्ष्यसेऽशुभात् · ESTD. 1969</text>
  </g>
</svg>
