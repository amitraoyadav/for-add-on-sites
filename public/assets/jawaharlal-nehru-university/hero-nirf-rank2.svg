<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNirf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F2847" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgNirf)" rx="16" />

  <!-- Podium & Ranking Laurel -->
  <g transform="translate(80, 80)">
    <!-- Laurel Wreath -->
    <path d="M120 180 C80 140 80 80 140 40 C120 70 120 130 150 160 Z" fill="#F59E0B" opacity="0.8" />
    <path d="M320 180 C360 140 360 80 300 40 C320 70 320 130 290 160 Z" fill="#F59E0B" opacity="0.8" />

    <!-- Center Trophy Badge -->
    <circle cx="220" cy="110" r="50" fill="#1E3A8A" stroke="#FBBF24" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(245,158,11,0.3))" />
    <text x="220" y="105" font-family="'Cinzel', serif" font-size="32" font-weight="900" fill="#FBBF24" text-anchor="middle">#2</text>
    <text x="220" y="125" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">NIRF RANK</text>

    <!-- Podium Steps -->
    <rect x="60" y="200" width="100" height="60" fill="#1E293B" rx="4" />
    <text x="110" y="235" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#94A3B8" text-anchor="middle">#3</text>

    <rect x="170" y="170" width="100" height="90" fill="#0F2847" stroke="#3B82F6" stroke-width="2" rx="4" />
    <text x="220" y="215" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#F59E0B" text-anchor="middle">#2</text>
    <text x="220" y="235" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#E2E8F0" text-anchor="middle">JNU INDIA</text>

    <rect x="280" y="190" width="100" height="70" fill="#1E293B" rx="4" />
    <text x="330" y="225" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#94A3B8" text-anchor="middle">#1</text>
  </g>

  <!-- Banner -->
  <g transform="translate(40, 40)">
    <rect width="250" height="42" rx="8" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5" />
    <text x="20" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#EFF6FF">TOP RANKED IN INDIA</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#93C5FD">NIRF #2 Universities · NAAC A++ (3.77)</text>
  </g>
</svg>
