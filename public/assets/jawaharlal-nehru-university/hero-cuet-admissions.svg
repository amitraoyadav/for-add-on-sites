<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCuet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="50%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgCuet)" rx="16" />

  <!-- Admission Portal Mockup -->
  <g transform="translate(80, 70)">
    <rect x="30" y="20" width="380" height="230" rx="10" fill="#0F172A" stroke="#DC2626" stroke-width="2" />
    <rect x="45" y="35" width="350" height="200" rx="6" fill="#1E293B" />

    <!-- Header bar -->
    <rect x="45" y="35" width="350" height="32" fill="#991B1B" />
    <text x="65" y="55" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">JNU ADMISSIONS 2026-27 | CUET (UG / PG) &amp; Ph.D.</text>

    <!-- Deprivation Points Badge -->
    <rect x="65" y="80" width="310" height="28" rx="4" fill="#7F1D1D" opacity="0.6" stroke="#EF4444" stroke-width="1" />
    <text x="75" y="98" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#FCA5A5">★ Inclusive Policy: Up to 12 Deprivation Points for Rural &amp; Female Candidates</text>

    <!-- Program Selection Form Lines -->
    <rect x="65" y="120" width="150" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <text x="75" y="135" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Select School: SSS / SIS / SLLCS</text>

    <rect x="225" y="120" width="150" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <text x="235" y="135" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Degree: M.A. / M.Sc. / Ph.D.</text>

    <rect x="65" y="150" width="310" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <text x="75" y="165" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Entrance Category: CUET Score / JRF / NET Exemption</text>

    <!-- Action Button -->
    <rect x="65" y="185" width="150" height="32" rx="6" fill="#16A34A" />
    <text x="140" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">SUBMIT APPLICATION</text>
  </g>

  <!-- Banner -->
  <g transform="translate(40, 40)">
    <rect width="250" height="42" rx="8" fill="#991B1B" stroke="#F87171" stroke-width="1.5" />
    <text x="20" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#FEE2E2">ADMISSIONS 2026 LIVE</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FECACA">CUET UG / PG · Ph.D. Entrance Examination</text>
  </g>
</svg>
