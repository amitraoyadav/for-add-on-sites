<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F8F8"/>
      <stop offset="100%" stop-color="#E5EFEB"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5ECE0"/>
      <stop offset="100%" stop-color="#E9DEC8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0c1b2a" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="400" height="480" rx="16" fill="url(#cardBg)"/>
  
  <g filter="url(#shadow)" transform="translate(110, 50)">
    <rect x="0" y="20" width="180" height="300" rx="6" fill="url(#boxGrad)" stroke="#D8CDBA" stroke-width="1.5"/>
    <path d="M0 20 L24 0 L204 0 L180 20 Z" fill="#E2D6C0" stroke="#D8CDBA" stroke-width="1.5"/>
    <path d="M180 20 L204 0 L204 300 L180 320 Z" fill="#D3C5AA" stroke="#D8CDBA" stroke-width="1.5"/>
    
    <line x1="20" y1="50" x2="160" y2="50" stroke="#B8A88E" stroke-width="1" stroke-dasharray="2 3"/>
    
    <!-- Organic Forest Teal/Bleue Band -->
    <rect x="0" y="80" width="180" height="95" fill="#134E4A"/>
    
    <g fill="#FFFFFF" transform="translate(72, 88) scale(0.18)">
      <path d="M78 52 C72 44 65 38 52 35 C42 32 30 33 22 38 C18 40 14 44 12 48 C10 52 11 56 15 58 C20 60 27 58 34 54 C40 50 48 48 55 50 C62 52 68 56 74 61 C60 63 46 68 35 76 C26 82 20 90 22 96 C24 100 30 102 38 98 C48 93 57 84 66 75 C73 68 80 62 88 58 Z" />
      <path d="M78 52 C85 40 98 25 116 14 C132 4 150 0 172 2 C184 3 194 6 198 10 C200 12 198 15 192 16 C176 18 160 25 146 36 C134 45 124 57 118 70 C114 62 104 55 94 51 Z" />
    </g>
    
    <text x="90" y="132" text-anchor="middle" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="2">BLEU</text>
    <text x="90" y="152" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="9" font-weight="600" fill="#CCFBF1" letter-spacing="2">ORGANIC DARK ROAST</text>
    
    <text x="90" y="205" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="700" fill="#2D3748" letter-spacing="1">SMOKY &amp; MARSHMALLOW</text>
    <text x="90" y="225" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" font-style="italic" fill="#4A5568">Dark Chocolate, Molasses, Toast</text>
    
    <line x1="40" y1="245" x2="140" y2="245" stroke="#CBD5E0" stroke-width="1"/>
    <text x="90" y="265" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="9" font-weight="600" fill="#718096" letter-spacing="1">12 OZ (340G) • USDA ORGANIC</text>
    
    <circle cx="90" cy="295" r="12" fill="#D4AF37"/>
    <text x="90" y="299" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#0C1B2A">LC</text>
  </g>
</svg>
