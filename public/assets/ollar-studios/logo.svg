<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" fill="none">
  <!-- Minimalist Studio Emblem -->
  <g transform="translate(10, 8)">
    <rect x="0" y="2" width="58" height="56" rx="14" fill="#0D1117" stroke="#3B82F6" stroke-width="2.2"/>
    <!-- Studio Shutter / Soundwave Rings -->
    <circle cx="29" cy="30" r="17" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="29" cy="30" r="9" fill="#2563EB"/>
    <circle cx="25" cy="26" r="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="44" y="10" width="5" height="5" rx="2.5" fill="#3B82F6"/>
  </g>
  <!-- Wordmark -->
  <text x="80" y="37" font-family="'Poppins', sans-serif" font-weight="800" font-size="25" letter-spacing="2" fill="#0F172A">
    OLLAR <tspan fill="#2563EB">STUDIOS</tspan>
  </text>
  <text x="82" y="54" font-family="'Poppins', sans-serif" font-weight="600" font-size="9.5" letter-spacing="3.5" fill="#64748B">
    STUDIO RENTALS &amp; PRODUCTION
  </text>
</svg>
