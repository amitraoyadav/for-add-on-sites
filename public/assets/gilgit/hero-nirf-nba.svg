  <!-- Right Visual Plaque -->
  <g transform="translate(740, 100)">
    <rect width="380" height="400" rx="24" fill="#06182D" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>
    
    <g transform="translate(190, 130)">
