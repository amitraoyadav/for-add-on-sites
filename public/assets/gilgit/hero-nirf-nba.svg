<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradNirfNba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="50%" stop-color="#133E68"/>
      <stop offset="100%" stop-color="#041527"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradNirfNba)"/>
  <circle cx="890" cy="280" r="320" fill="#0284C7" fill-opacity="0.2"/>

  <!-- Left Content -->
  <g transform="translate(80, 100)">
    <rect width="320" height="36" rx="18" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#38BDF8"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#BAE6FD">
