    <rect x="90" y="325" width="200" height="34" rx="17" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="1"/>
    <text x="190" y="347" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#BAE6FD">
