    <g transform="translate(0, 300)">
      <rect width="520" height="85" rx="12" fill="#06182D" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
      <g transform="translate(25, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="26" font-weight="800" fill="#38BDF8">NBA</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Tier-1 Accredited</text>
      </g>
      <line x1="160" y1="15" x2="160" y2="70" stroke="#1E3A8A"/>
      <g transform="translate(185, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="26" font-weight="800" fill="#F59E0B">NAAC A</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Institutional Grade</text>
      </g>
      <line x1="340" y1="15" x2="340" y2="70" stroke="#1E3A8A"/>
      <g transform="translate(365, 22)">
