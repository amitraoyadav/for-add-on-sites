<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradPlacement58" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147"/>
      <stop offset="60%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#031124"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="placementGlow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#002147" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradPlacement58)"/>
  <circle cx="880" cy="280" r="340" fill="url(#placementGlow)"/>

  <!-- Left Content -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect width="320" height="36" rx="18" fill="#DA251C" fill-opacity="0.3" stroke="#DA251C" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#DA251C"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FCA5A5">
      RECORD BREAKING PLACEMENTS
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      ₹58 LAKH HIGHEST PACKAGE
    </text>
    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#F59E0B">
      3,000+ Offers · 300+ Top Recruiters
    </text>
    <text x="0" y="180" font-family="'Poppins', sans-serif" font-size="26" font-weight="600" fill="#E2E8F0">
      Gilgit Institute of Technology &amp; Management
    </text>

    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#CBD5E1">
      Scholars recruited by Palo Alto Networks, Amazon, Cisco, Intuit, Autodesk, and Morgan Stanley.
    </text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      Top engineering &amp; management placement destination in Greater Noida &amp; Delhi-NCR.
    </text>

    <!-- Metrics Plaque -->
    <g transform="translate(0, 300)">
      <rect width="520" height="85" rx="12" fill="#0B2545" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
      <g transform="translate(25, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#F59E0B">₹58 LPA</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Highest CTC</text>
      </g>
      <line x1="160" y1="15" x2="160" y2="70" stroke="#1E3A8A"/>
      <g transform="translate(185, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">3,000+</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Placement Offers</text>
      </g>
      <line x1="340" y1="15" x2="340" y2="70" stroke="#1E3A8A"/>
      <g transform="translate(365, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#38BDF8">300+</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Corporate Recruiters</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Plaque -->
  <g transform="translate(740, 100)">
    <rect width="380" height="400" rx="24" fill="#0B2545" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3"/>
    
    <g transform="translate(190, 120)">
      <circle cx="0" cy="0" r="60" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
      <!-- Trophy Icon -->
      <path d="M-20 -25 L20 -25 L16 10 C16 22 0 25 0 25 C0 25 -16 22 -16 10 Z" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
      <path d="M-20 -15 C-32 -15 -32 5 -16 8" stroke="#FBBF24" stroke-width="3" fill="none"/>
      <path d="M20 -15 C32 -15 32 5 16 8" stroke="#FBBF24" stroke-width="3" fill="none"/>
      <path d="M-6 25 L6 25 L10 38 L-10 38 Z" fill="#D97706"/>
      <rect x="-18" y="38" width="36" height="8" rx="2" fill="#78350F"/>
    </g>

    <text x="190" y="225" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
      CORPORATE EXCELLENCE
    </text>
    <text x="190" y="250" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F59E0B">
      Palo Alto Networks · Amazon · Cisco
    </text>
    <text x="190" y="280" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#CBD5E1">
      Intuit · Morgan Stanley · Adobe · Capgemini
    </text>

    <rect x="90" y="315" width="200" height="34" rx="17" fill="#DA251C" fill-opacity="0.3" stroke="#DA251C" stroke-width="1"/>
    <text x="190" y="337" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FEE2E2">
      TOP PLACEMENT COLLEGE
    </text>
  </g>
</svg>
