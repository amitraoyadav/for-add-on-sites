<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGradInfra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#021C1B"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradInfra)"/>
  <circle cx="890" cy="270" r="330" fill="url(#tealGlow)"/>

  <!-- Left Content -->
  <g transform="translate(80, 100)">
    <rect width="320" height="36" rx="18" fill="#14B8A6" fill-opacity="0.25" stroke="#2DD4BF" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#2DD4BF"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#CCFBF1">
      WORLD-CLASS INFRASTRUCTURE
    </text>

    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      KNOWLEDGE PARK CAMPUS
    </text>
    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#2DD4BF">
      Greater Noida · Delhi-NCR
    </text>
    <text x="0" y="180" font-family="'Poppins', sans-serif" font-size="26" font-weight="600" fill="#E2E8F0">
      State-of-the-Art Academic Infrastructure
    </text>

    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#CBD5E1">
      Equipped with a 1,000+ seater Central AC Auditorium, Automated Digital Library, and Cafeterias.
    </text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#99F6E4">
      Secure high-speed Wi-Fi residential campus with on-campus medical and sports amenities.
    </text>

    <!-- Metrics Plaque -->
    <g transform="translate(0, 300)">
      <rect width="520" height="85" rx="12" fill="#115E59" fill-opacity="0.8" stroke="#0F766E" stroke-width="1"/>
      <g transform="translate(25, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="26" font-weight="800" fill="#2DD4BF">15+ Acres</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#CCFBF1">Knowledge Park II</text>
      </g>
      <line x1="170" y1="15" x2="170" y2="70" stroke="#0F766E"/>
      <g transform="translate(195, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">1,000+ Seater</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#CCFBF1">Central Auditorium</text>
      </g>
      <line x1="350" y1="15" x2="350" y2="70" stroke="#0F766E"/>
      <g transform="translate(375, 22)">
        <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="26" font-weight="800" fill="#FBBF24">10,000+</text>
        <text x="0" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#CCFBF1">Student Community</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Plaque -->
  <g transform="translate(740, 100)">
    <rect width="380" height="400" rx="24" fill="#115E59" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.3"/>
    
    <g transform="translate(190, 130)">
      <circle cx="0" cy="0" r="60" fill="#14B8A6" fill-opacity="0.2" stroke="#2DD4BF" stroke-width="2"/>
      <!-- Campus Building Icon -->
      <path d="M-28 20 L28 20 L28 24 L-28 24 Z" fill="#2DD4BF"/>
      <path d="M-22 20 L-22 -10 L0 -24 L22 -10 L22 20 Z" fill="#CCFBF1"/>
      <line x1="-14" y1="-5" x2="-14" y2="15" stroke="#115E59" stroke-width="2"/>
      <line x1="-6" y1="-5" x2="-6" y2="15" stroke="#115E59" stroke-width="2"/>
      <line x1="6" y1="-5" x2="6" y2="15" stroke="#115E59" stroke-width="2"/>
      <line x1="14" y1="-5" x2="14" y2="15" stroke="#115E59" stroke-width="2"/>
      <polygon points="0,-24 -24,-8 24,-8" fill="#14B8A6"/>
    </g>

    <text x="190" y="235" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
      CAMPUS INFRASTRUCTURE
    </text>
    <text x="190" y="260" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#2DD4BF">
      Knowledge Park II, Greater Noida
    </text>
    <text x="190" y="290" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#CCFBF1">
      Adjacent to Metro Station &amp; Expressway
    </text>

    <rect x="90" y="325" width="200" height="34" rx="17" fill="#14B8A6" fill-opacity="0.3" stroke="#14B8A6" stroke-width="1"/>
    <text x="190" y="347" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E6FFFA">
      PREMIER METRO CAMPUS
    </text>
  </g>
</svg>
