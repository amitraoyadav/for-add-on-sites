    <path d="M 38 49 L 38 64" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="24" cy="27" r="2.2" fill="#FDE047"/>
    <circle cx="52" cy="27" r="2.2" fill="#FDE047"/>
    <circle cx="20" cy="38" r="1.8" fill="#FDE047"/>
    <circle cx="56" cy="38" r="1.8" fill="#FDE047"/>
    <circle cx="38" cy="14" r="2.5" fill="#FDE047"/>
  </g>

  <!-- Typography: SHIV NADAR UNIVERSITY in White / Light Gold -->
  <text x="96" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">
