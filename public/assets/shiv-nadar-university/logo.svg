<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 92" width="540" height="92">
  <defs>
    <linearGradient id="snuBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="snuRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="snuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Crest Shield -->
  <g transform="translate(12, 6)">
    <!-- Outer Shield with Shadow -->
    <path d="M 38 4 C 58 4, 72 10, 72 18 C 72 48, 52 68, 38 78 C 24 68, 4 48, 4 18 C 4 10, 18 4, 38 4 Z" 
          fill="url(#snuBlueGrad)" stroke="url(#snuGoldGrad)" stroke-width="2.5"/>
    
    <!-- Inner Accent Border -->
    <path d="M 38 9 C 54 9, 66 14, 66 21 C 66 45, 50 63, 38 71 C 26 63, 10 45, 10 21 C 10 14, 22 9, 38 9 Z" 
          fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>

    <!-- Central Flame of Wisdom & Beacon -->
    <path d="M 38 20 C 44 26, 47 34, 43 42 C 40 47, 36 50, 38 56 C 35 52, 33 46, 34 40 C 35 34, 32 30, 38 20 Z" 
          fill="url(#snuGoldGrad)"/>
    <path d="M 38 25 C 41 29, 43 35, 40 40 C 38 44, 36 46, 38 51 C 36 48, 35 44, 36 39 C 37 34, 34 32, 38 25 Z" 
          fill="#FFFBEB"/>

    <!-- Open Book of Knowledge -->
    <path d="M 23 48 C 29 45, 34 46, 38 49 C 42 46, 47 45, 53 48 C 53 58, 45 61, 38 64 C 31 61, 23 58, 23 48 Z" 
          fill="url(#snuRedGrad)"/>
    <path d="M 38 49 L 38 64" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Five Stars of Eminence -->
    <circle cx="24" cy="27" r="2.2" fill="#FDE047"/>
    <circle cx="52" cy="27" r="2.2" fill="#FDE047"/>
    <circle cx="20" cy="38" r="1.8" fill="#FDE047"/>
    <circle cx="56" cy="38" r="1.8" fill="#FDE047"/>
    <circle cx="38" cy="14" r="2.5" fill="#FDE047"/>
  </g>

  <!-- Typography: SHIV NADAR UNIVERSITY -->
  <text x="96" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="25" font-weight="800" fill="#002D62" letter-spacing="1.2">
    SHIV NADAR
  </text>
  <text x="282" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="25" font-weight="400" fill="#BE123C" letter-spacing="1.5">
    UNIVERSITY
  </text>
  
  <!-- Subtitle Tagline & Recognition -->
  <text x="96" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#D97706" letter-spacing="3.2">
    DELHI NCR · DEEMED TO BE UNIVERSITY
  </text>
  <text x="96" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.8">
    INSTITUTION OF EMINENCE · ESTD. BY SHIV NADAR FOUNDATION
  </text>

  <!-- Divider Line -->
  <line x1="96" y1="44" x2="520" y2="44" stroke="#E2E8F0" stroke-width="1"/>
</svg>
