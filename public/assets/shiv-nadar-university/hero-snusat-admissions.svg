<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="snusatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="admitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#snusatBg)"/>

  <!-- Geometric rings -->
  <g opacity="0.2">
    <circle cx="700" cy="250" r="180" fill="none" stroke="#C084FC" stroke-width="2"/>
    <circle cx="700" cy="250" r="120" fill="none" stroke="#F472B6" stroke-width="2"/>
    <circle cx="700" cy="250" r="60" fill="none" stroke="#E879F9" stroke-width="2"/>
  </g>

  <!-- Tag -->
  <rect x="50" y="44" width="250" height="32" rx="16" fill="#A855F7" fill-opacity="0.2" stroke="#C084FC" stroke-width="1.5"/>
  <circle cx="66" cy="60" r="5" fill="#E879F9"/>
  <text x="80" y="64" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F3E8FF" letter-spacing="1">ADMISSIONS 2026-27</text>

  <!-- Header -->
  <text x="50" y="125" font-family="'Cinzel', 'Playfair Display', serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    SNUSAT &amp; APT Applications Open
  </text>
  <text x="50" y="165" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#E879F9">
    Undergraduate, Postgraduate &amp; Doctoral Programs
  </text>
  <text x="50" y="200" font-family="'Inter', sans-serif" font-size="14" fill="#E2E8F0">
    Multiple pathways: SNUSAT + APT, JEE Main, CUET, SAT, ACT &amp; Merit Scholarships up to 100%
  </text>

  <!-- Feature Grid -->
  <g transform="translate(50, 240)">
    <rect width="210" height="140" rx="14" fill="#3B0764" fill-opacity="0.7" stroke="#A855F7" stroke-width="1.5"/>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E879F9" letter-spacing="1">SNUSAT PATHWAY</text>
    <text x="24" y="78" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Aptitude + APT</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#F3E8FF">Verbal, Quant, Logic + Subject test</text>
    <text x="24" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#C084FC">Online test from Pearson VUE centres</text>
  </g>

  <g transform="translate(280, 240)">
    <rect width="210" height="140" rx="14" fill="#3B0764" fill-opacity="0.7" stroke="#EC4899" stroke-width="1.5"/>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F472B6" letter-spacing="1">NATIONAL EXAMS</text>
    <text x="24" y="78" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">JEE &amp; CUET</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#FCE7F3">Direct admission with JEE percentile</text>
    <text x="24" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#F472B6">SAT (1300+) / ACT (28+) accepted</text>
  </g>

  <g transform="translate(510, 240)">
    <rect width="240" height="140" rx="14" fill="#3B0764" fill-opacity="0.7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDE047" letter-spacing="1">SCHOLARSHIPS</text>
    <text x="24" y="78" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Up to 100%</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#FEF3C7">Merit waivers on tuition &amp; hostel</text>
    <text x="24" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#FDE047">Sports excellence &amp; need-based aid</text>
  </g>
</svg>
