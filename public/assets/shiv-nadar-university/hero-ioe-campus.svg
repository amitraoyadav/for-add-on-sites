<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="snuCampusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B3A"/>
      <stop offset="60%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#001428"/>
    </linearGradient>
    <linearGradient id="snuCampusGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="campusSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#snuCampusBg)"/>
  <circle cx="680" cy="180" r="280" fill="url(#campusSphere)"/>

  <!-- Architectural Stylized Campus Silhouette -->
  <g opacity="0.18">
    <polygon points="50,420 120,310 190,420" fill="#38BDF8"/>
    <rect x="180" y="270" width="130" height="150" fill="#E2E8F0"/>
    <rect x="330" y="240" width="160" height="180" fill="#38BDF8"/>
    <polygon points="410,180 330,240 490,240" fill="#F59E0B"/>
    <rect x="510" y="290" width="140" height="130" fill="#E2E8F0"/>
    <circle cx="660" cy="300" r="60" fill="#F43F5E"/>
    <rect x="670" y="320" width="110" height="100" fill="#38BDF8"/>
  </g>

  <!-- Ground Line -->
  <line x1="40" y1="420" x2="760" y2="420" stroke="url(#snuCampusGlow)" stroke-width="3"/>

  <!-- Badge Top -->
  <rect x="50" y="44" width="235" height="32" rx="16" fill="#E11D48" fill-opacity="0.25" stroke="#F43F5E" stroke-width="1.5"/>
  <circle cx="66" cy="60" r="5" fill="#F43F5E"/>
  <text x="80" y="64" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FECDD3" letter-spacing="1">INSTITUTION OF EMINENCE</text>

  <!-- Title & Headline -->
  <text x="50" y="125" font-family="'Cinzel', 'Playfair Display', serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    Education for Life
  </text>
  <text x="50" y="165" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#38BDF8">
    286-Acre Residential Research University in Delhi-NCR
  </text>
  <text x="50" y="200" font-family="'Inter', sans-serif" font-size="14" fill="#CBD5E1">
    Founded by Shiv Nadar Foundation · Top 60 in NIRF · Global Collaborations with CMU &amp; ASU
  </text>

  <!-- 3 Stats Cards -->
  <g transform="translate(50, 240)">
    <rect width="210" height="140" rx="14" fill="#0F2D54" fill-opacity="0.8" stroke="#1E4976" stroke-width="1.5"/>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">CAMPUS INFRA</text>
    <text x="24" y="78" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">286</text>
    <text x="96" y="76" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FDE047">Acres</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Green, sustainable, 100% residential</text>
    <text x="24" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Greater Noida, Delhi-NCR</text>
  </g>

  <g transform="translate(280, 240)">
    <rect width="210" height="140" rx="14" fill="#0F2D54" fill-opacity="0.8" stroke="#BE123C" stroke-width="1.5"/>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDA4AF" letter-spacing="1">STUDENT-FACULTY</text>
    <text x="24" y="78" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">10:1</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Ratio with 100% PhD faculty</text>
    <text x="24" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">From world-leading universities</text>
  </g>

  <g transform="translate(510, 240)">
    <rect width="240" height="140" rx="14" fill="#0F2D54" fill-opacity="0.8" stroke="#D97706" stroke-width="1.5"/>
    <text x="24" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDE047" letter-spacing="1">UNDERGRAD RESEARCH</text>
    <text x="24" y="78" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">OUR</text>
    <text x="100" y="76" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#38BDF8">Program</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Funded research grants for UG students</text>
    <text x="24" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Patents, peer-reviewed publications</text>
  </g>
</svg>
