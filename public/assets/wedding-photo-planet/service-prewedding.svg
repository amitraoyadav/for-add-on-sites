<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="35%" stop-color="#4C1D95" />
      <stop offset="65%" stop-color="#BE185D" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#sunsetGrad)" />

  <!-- Sun Sphere on Horizon -->
  <circle cx="300" cy="270" r="80" fill="#FEF08A" opacity="0.9" />

  <!-- Mountain Silhouettes -->
  <path d="M-50 350 L120 280 L280 340 L450 260 L650 360 L650 450 L-50 450 Z" fill="#311042" opacity="0.8" />
  <path d="M-20 400 L180 340 L340 380 L520 330 L620 400 L620 450 L-20 450 Z" fill="#180720" />

  <!-- Couple Silhouette by the Lake / Scenic Backdrop -->
  <!-- Man -->
  <circle cx="270" cy="235" r="9" fill="#0F0514" />
  <path d="M260 245 C255 270 250 310 250 370 L268 370 L273 310 L278 370 L292 370 C290 300 285 260 280 245 Z" fill="#0F0514" />
  <!-- Arm extended holding hands -->
  <path d="M280 255 Q 300 270 315 260" stroke="#0F0514" stroke-width="4.5" fill="none" />

  <!-- Woman in Gown -->
  <circle cx="330" cy="240" r="8.5" fill="#0F0514" />
  <path d="M320 250 C322 275 320 290 310 320 Q 300 370 290 390 L 375 390 Q 355 350 340 310 L 338 250 Z" fill="#0F0514" />
  <!-- Gown Train -->
  <path d="M330 330 Q 380 360 430 390 L 360 390 Z" fill="#0F0514" opacity="0.9" />

  <text x="300" y="420" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#FFFFFF">PRE-WEDDING PHOTOGRAPHY</text>
  <text x="300" y="438" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#FEF08A">GOA • RISHIKESH • TAJ MAHAL • GURUGRAM</text>
</svg>
