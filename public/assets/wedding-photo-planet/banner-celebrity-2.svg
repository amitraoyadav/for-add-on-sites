<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" fill="none">
  <defs>
    <linearGradient id="palaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#palaceGrad)" />

  <!-- Royal Rajasthan Palace / Fort Jharokha Architecture -->
  <g stroke="#F59E0B" stroke-width="2" opacity="0.3" fill="none">
    <path d="M150 480 L150 180 Q 250 100 350 180 L350 480 Z" />
    <path d="M450 480 L450 140 Q 600 60 750 140 L750 480 Z" />
    <path d="M850 480 L850 180 Q 950 100 1050 180 L1050 480 Z" />
    <!-- Palace domes -->
    <path d="M220 100 Q 250 40 280 100 Z" fill="#D97706" opacity="0.4" />
    <path d="M560 60 Q 600 0 640 60 Z" fill="#D97706" opacity="0.4" />
    <path d="M920 100 Q 950 40 980 100 Z" fill="#D97706" opacity="0.4" />
  </g>

  <!-- Hanging Diya Lanterns -->
  <g fill="#FBBF24">
    <circle cx="200" cy="120" r="12" opacity="0.8" />
    <circle cx="380" cy="90" r="15" opacity="0.85" />
    <circle cx="600" cy="100" r="18" opacity="0.9" />
    <circle cx="820" cy="90" r="15" opacity="0.85" />
    <circle cx="1000" cy="120" r="12" opacity="0.8" />
  </g>

  <rect x="340" y="380" width="520" height="42" rx="21" fill="#000000" opacity="0.7" stroke="#F59E0B" stroke-width="1.5" />
  <text x="600" y="407" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#FDE68A">
    HERITAGE DESTINATION WEDDING EXPERIENCES
  </text>
</svg>
