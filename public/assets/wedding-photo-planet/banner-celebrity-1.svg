<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" fill="none">
  <defs>
    <linearGradient id="ban1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180018" />
      <stop offset="50%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#701A75" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#ban1Grad)" />
  <circle cx="600" cy="240" r="320" fill="url(#stageGlow)" />

  <!-- Cold Pyro Sparklers / Red Carpet Vibe -->
  <g stroke="#FDE047" stroke-width="1.5" opacity="0.8">
    <!-- Left Pyros -->
    <line x1="200" y1="400" x2="150" y2="180" stroke-dasharray="4 6" />
    <line x1="220" y1="400" x2="200" y2="140" stroke-dasharray="3 5" />
    <line x1="240" y1="400" x2="270" y2="160" stroke-dasharray="4 6" />
    <!-- Right Pyros -->
    <line x1="960" y1="400" x2="930" y2="160" stroke-dasharray="4 6" />
    <line x1="980" y1="400" x2="1000" y2="140" stroke-dasharray="3 5" />
    <line x1="1000" y1="400" x2="1050" y2="180" stroke-dasharray="4 6" />
  </g>

  <!-- Grand Floral Arch & Couple Stage Silhouette -->
  <path d="M400 480 Q 600 80 800 480" stroke="#F59E0B" stroke-width="8" fill="none" opacity="0.6" />
  <path d="M420 480 Q 600 110 780 480" stroke="#EF4444" stroke-width="5" fill="none" opacity="0.5" />

  <!-- Center Grand Couple -->
  <circle cx="575" cy="225" r="14" fill="#FCE7F3" opacity="0.9" />
  <circle cx="625" cy="235" r="13" fill="#FCE7F3" opacity="0.9" />
  <path d="M555 245 L595 245 L600 440 L550 440 Z" fill="#F59E0B" opacity="0.9" />
  <path d="M605 255 L650 255 L675 440 L590 440 Z" fill="#BE185D" opacity="0.9" />

  <!-- Gold Leaf Accent Title -->
  <rect x="360" y="380" width="480" height="40" rx="20" fill="#000000" opacity="0.6" />
  <text x="600" y="405" text-anchor="middle" font-family="'Raleway', sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#FDE047">
    CELEBRITY &amp; GRAND WEDDINGS BY WEDDING PHOTO PLANET
  </text>
</svg>
